[package]
name = "hotaru-overlay"
version = "0.1.0"
description = "Keymap overlay for VIA keyboards"
authors = ["sueuegunn"]
edition = "2021"
# probe (src/bin) is a second binary; `tauri dev` must still start this one.
default-run = "hotaru-overlay"

[lib]
name = "hotaru_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api is what makes a transparent window possible on macOS.
# image-png is what lets Image::from_bytes take the include_bytes!'d tray icons.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
# The keyboard is asked over VIA's raw HID interface (usage page 0xFF60).
# macos-shared-device: open it without seizing it, so VIA (or a browser)
# holding the same interface does not lock us out, nor we them.
hidapi = { version = "2", features = ["macos-shared-device"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
